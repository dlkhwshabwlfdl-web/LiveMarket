# LiveMarket messages — MiniMessage format (https://docs.advntr.dev/minimessage).
# Placeholders look like {item}, {price}, {amount} and are filled in by the plugin.
prefix: "<dark_gray>[<gradient:#57e389:#2ea86a><bold>LiveMarket</bold></gradient>]</dark_gray> "
no-permission: "<red>✖ You don't have permission to do that.</red>"
player-only: "<red>✖ Only players can use this.</red>"
unknown-item: "<red>✖ <white>{item}</white> is not traded on this market.</red>"
invalid-amount: "<red>✖ Amount must be a whole number between 1 and {max}.</red>"
not-enough-money: "<red>✖ You need <white>{cost}</white> but only have <white>{balance}</white>.</red>"
not-enough-items: "<red>✖ You only have <white>{have} × {item}</white>.</red>"
inventory-full: "<red>✖ Your inventory is full — nothing was charged.</red>"
economy-error: "<red>✖ The economy plugin rejected that transaction. Nothing was charged.</red>"
bought: "<green>✔ Bought <white>{amount} × {item}</white> for <white>{cost}</white></green> <dark_gray>◆</dark_gray> <gray>new price <white>{price}</white></gray>"
sold: "<green>✔ Sold <white>{amount} × {item}</white> for <white>{gain}</white></green> <gray><dark_gray>({tax}% fee)</dark_gray> ◆ new price <white>{price}</white></gray>"
sold-all: "<green>✔ Sold everything tradable for <white>{gain}</white>.</green>"
sold-nothing: "<gray>You have nothing tradable to sell.</gray>"
price-info: "<yellow>◆ {item}</yellow> <dark_gray>—</dark_gray> <white>{price}</white> <gray>(base {base})</gray> {trend}"
price-header: "<gradient:#57e389:#2ea86a><bold>— Market prices —</bold></gradient>"
top-header: "<gradient:#57e389:#2ea86a><bold>— Biggest movers today —</bold></gradient>"
top-line: "<yellow>◆ {item}</yellow> <white>{change}%</white> <gray>(now {price})</gray>"
top-empty: "<gray>No trades yet today — be the first to move the market.</gray>"
alert-set: "<green>✔ Alert set:</green> <white>{item}</white> <gray>{condition}</gray> <white>{price}</white><gray>.</gray>"
alert-removed: "<gray>Alert removed for <white>{item}</white>.</gray>"
alerts-header: "<gradient:#57e389:#2ea86a><bold>— Your price alerts —</bold></gradient>"
alerts-empty: "<gray>You have no price alerts. Set one with <white>/market alert (item) (above|below) (price)</white>.</gray>"
alert-fired: "<gold>⚑ Price alert!</gold> <white>{item}</white> <yellow>is now</yellow> <white>{price}</white> <gray>({condition} your {target})</gray>"
alert-usage: "<red>✖ Usage: <white>/market alert (item) (above|below) (price)</white> — or <white>/market alert (item) remove</white>.</red>"
reloaded: "<green>✔ LiveMarket reloaded.</green>"
setprice-done: "<green>✔ <white>{item}</white> price set to <white>{price}</white>.</green>"
reset-done: "<green>✔ <white>{item}</white> reset to its base price <white>{base}</white>.</green>"
debug-on: "<green>✔ Debug mode <white>ON</white> — every mechanism now writes analysis lines to the server log.</green>"
debug-off: "<gray>Debug mode <white>OFF</white>.</gray>"
help:
  - "<gradient:#57e389:#2ea86a><bold>— LiveMarket —</bold></gradient>"
  - "<click:suggest_command:'/market'><yellow>/market</yellow></click> <gray>— open the market GUI</gray>"
  - "<click:suggest_command:'/market buy '><yellow>/market buy (item) [amount]</yellow></click> <gray>— buy at the live price</gray>"
  - "<click:suggest_command:'/market sell '><yellow>/market sell (item) [amount]</yellow></click> <gray>— sell (a small fee applies)</gray>"
  - "<click:suggest_command:'/market sellall'><yellow>/market sellall</yellow></click> <gray>— sell everything tradable</gray>"
  - "<click:suggest_command:'/market price '><yellow>/market price [item]</yellow></click> <gray>— live prices and trends</gray>"
  - "<click:suggest_command:'/market top'><yellow>/market top</yellow></click> <gray>— biggest movers today</gray>"
  - "<click:suggest_command:'/market alert '><yellow>/market alert (item) (above|below) (price)</yellow></click> <gray>— price alerts</gray>"
  - "<click:suggest_command:'/market alerts'><yellow>/market alerts</yellow></click> <gray>— your alerts</gray>"
gui:
  shop-title: "<gradient:#57e389:#2ea86a><bold>Live Market</bold></gradient>"
  detail-title: "<dark_green><bold>Market</bold></dark_green> <dark_gray>—</dark_gray> <white>{item}</white>"
  your-balance: "<gray>Your balance:</gray> <gold>{balance}</gold>"
  buy: "<green><bold>Buy</bold></green>"
  sell: "<red><bold>Sell</bold></red>"
  back: "<gray>← Back to market</gray>"
  price-line: "<gray>Price:</gray> <white>{price}</white> <dark_gray>(base {base})</dark_gray> {trend}"
  day-line: "<gray>Today:</gray> {change} <dark_gray>•</dark_gray> <gray>volume</gray> <white>{volume}</white>"
  range-line: "<gray>Range:</gray> <red>{floor}</red> <dark_gray>—</dark_gray> <green>{ceiling}</green>"
  history-line: "<gray>Recent:</gray> <white>{chart}</white>"
  total-buy: "<dark_gray>≈ {total} for {amount}</dark_gray>"
  total-sell: "<dark_gray>≈ {total} after fee</dark_gray>"
  click-hint: "<dark_gray>Click for details & trading</dark_gray>"
  top-movers: "<gold><bold>★ Top movers</bold></gold>"
