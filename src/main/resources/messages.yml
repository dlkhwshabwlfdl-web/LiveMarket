# LiveMarket messages. Placeholders look like {item}, {price}, {amount}.
# Colours use the classic & codes.
prefix: "&8[&aLiveMarket&8] &r"
no-permission: "&cYou don't have permission to do that."
player-only: "&cOnly players can use this."
unknown-item: "&c'{item}' is not traded on this market."
invalid-amount: "&cAmount must be a positive whole number (max {max})."
not-enough-money: "&cYou need {cost} but only have {balance}."
not-enough-items: "&cYou only have {have} x {item}."
inventory-full: "&cYour inventory is full — the purchase was refunded."
economy-error: "&cThe economy plugin rejected that transaction. Nothing was charged."
bought: "&aBought &f{amount} x {item} &afor &f{cost}&a. New price: &f{price}&a."
sold: "&aSold &f{amount} x {item} &afor &f{gain}&a (after {tax}% fee). New price: &f{price}&a."
sold-all: "&aSold everything tradable for &f{gain}&a."
sold-nothing: "&7You have nothing tradable to sell."
price-info: "&e{item}&7: now &f{price}&7 (base {base}) {trend}"
price-header: "&6--- Market prices ---"
top-header: "&6--- Biggest movers today ---"
top-line: "&e{item}&7: {change}% &7(now {price})"
top-empty: "&7No trades yet today."
alert-set: "&aAlert set: &f{item} &a{condition} &f{price}&a."
alert-removed: "&7Alert removed for &f{item}&7."
alerts-header: "&6--- Your price alerts ---"
alerts-empty: "&7You have no price alerts. Set one with /market alert <item> <above|below> <price>."
alert-fired: "&ePrice alert! &f{item} &eis now &f{price} &e({condition} your {target})."
alert-usage: "&cUsage: /market alert <item> <above|below> <price>"
reloaded: "&aLiveMarket reloaded."
setprice-done: "&a{item} price set to {price} by an admin."
reset-done: "&a{item} price reset to its base price {base}."
help:
  - "&6--- LiveMarket ---"
  - "&e/market &7- open the market GUI"
  - "&e/market buy <item> [amount] &7- buy items"
  - "&e/market sell <item> [amount] &7- sell items"
  - "&e/market sellall &7- sell everything tradable"
  - "&e/market price <item> &7- check a price"
  - "&e/market top &7- biggest movers today"
  - "&e/market alert <item> <above|below> <price> &7- set a price alert"
  - "&e/market alerts &7- list your alerts"
gui:
  shop-title: "&2Live Market"
  detail-title: "&2Market — {item}"
  your-balance: "&7Your balance: &f{balance}"
  buy: "&aBuy"
  sell: "&cSell"
  back: "&7Back to market"
  price-line: "&7Price: &f{price} &7(base {base}) {trend}"
  history-line: "&7Recent: &f{chart}"
  click-hint: "&7Click an item for details and trading"
